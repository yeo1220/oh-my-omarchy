# Voxtype Configuration — 이 시스템(Omarchy / Hyprland, Ryzen 3700X, RX 6900 XT 16GB) 맞춤 설정
#
# 위치: ~/.config/voxtype/config.toml
# 원본(Omarchy 기본값) 백업: config.toml.bak.omarchy-default
# 값 바꾼 뒤에는: systemctl --user restart voxtype
#
# 단축키는 Hyprland(Omarchy 기본)에서 처리:
#   F9 누르고 있는 동안 녹음(push-to-talk), SUPER+CTRL+X 토글, 녹음 중 F12 취소

state_file = "auto"

[hotkey]
# evdev 핫키 대신 Hyprland 키바인딩으로 `voxtype record`를 호출하므로 끔
enabled = false

[audio]
# "default" = PipeWire 시스템 기본 입력을 따름. 새 마이크/헤드셋을 꽂거나 블루투스로
# 연결하면 WirePlumber가 자동으로 기본 입력을 바꾸므로 설정을 손대지 않아도 됨.
device = "default"
sample_rate = 16000

# 안전 상한(초). 긴 받아쓰기도 끊기지 않도록 5분
max_duration_secs = 300

# 녹음 중 음악/영상 자동 일시정지
pause_media = true

[audio.feedback]
# 녹음 시작/종료를 짧은 소리로 알려줌 (화면을 안 보고도 상태 확인)
enabled = true
theme = "subtle"
volume = 0.5

[whisper]
# GPU(Vulkan)용 최상급 다국어 모델. 한국어/영어 모두 정확하고 16GB VRAM에 여유 있음.
# CPU 전용으로 돌려야 할 일이 생기면 "small" 또는 "medium"으로 낮출 것.
model = "large-v3-turbo"

# 한국어와 영어만 놓고 자동 감지 (다른 언어로 오인식 방지)
language = "ko,en"
translate = false

# Vulkan 플래시 어텐션: RDNA2에서 지원, 전사 속도 향상
flash_attention = true

# 짧은 한·영 혼합 힌트. 긴 한국어 문장을 넣으면 영어 음성까지 한국어로 풀리므로 이 정도가 최적(테스트 결과).
initial_prompt = "Hello. 안녕하세요."

[output]
# wtype으로 커서 위치에 직접 타이핑 (CJK 지원). 실패 시 클립보드로 대체.
mode = "type"
fallback_to_clipboard = true
type_delay_ms = 0
pre_type_delay_ms = 0

# Hyprland 서브맵 연동: 녹음 중 F12로 취소, 타이핑 중 modifier 키가 단축키를 오발동하지 않게 차단
# (서브맵 정의: ~/.config/hypr/voxtype.lua. Hyprland 0.56+ Lua 설정은 dispatch 인자도 Lua 문법이어야 함)
pre_recording_command = "hyprctl dispatch 'hl.dsp.submap(\"voxtype_recording\")'"
pre_output_command = "hyprctl dispatch 'hl.dsp.submap(\"voxtype_suppress\")'"
post_output_command = "hyprctl dispatch 'hl.dsp.submap(\"reset\")'"

[output.notification]
# 상태는 OSD 파형 패널과 소리로 확인하므로 알림은 끔
on_recording_start = false
on_recording_stop = false
on_transcription = false

[text]
# 영어 filler(um, uh 등) 제거. 한국어 추임새는 오탐 위험이 있어 목록에 넣지 않음.
filter_filler_words = true
spoken_punctuation = false

[vad]
# 무음/잡음만 녹음된 경우 전사하지 않고 버림 (실수로 키를 눌렀을 때 쓰레기 텍스트 방지)
enabled = true
backend = "whisper"
threshold = 0.5

[status]
# Omarchy 바(omarchy-shell) 아이콘 세트
icon_theme = "omarchy"

[osd]
enabled = true
frontend = "gtk4"
position = "bottom-center"
